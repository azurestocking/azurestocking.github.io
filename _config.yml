title: Gemma Li
description: Portfolio
baseurl: ""
url: "https://azurestocking.github.io"

# Set to false (or remove) when ready to launch — adds a noindex meta tag site-wide.
noindex: true

# Your GoatCounter site code -- the subdomain you pick when registering at
# goatcounter.com (e.g. "azurestocking" for azurestocking.goatcounter.com).
# Leave "" to disable analytics.
goatcounter: "azurestocking"

# Every page shows a brief loading screen until the first fraction of its media
# has rendered (with a hard timeout so no one gets stuck). Set false to disable.
page_loader: true
# Fraction of a page's media to load before revealing it.
page_loader_fraction: 0.34
# Max time (ms) to wait before revealing regardless of media state.
page_loader_timeout: 6000

markdown: kramdown
permalink: pretty

collections:
  projects:
    output: true
    permalink: /project/:title/

defaults:
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: "project"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - .DS_Store 