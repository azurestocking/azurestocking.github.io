title: Gemma Li
description: Portfolio
baseurl: ""
url: "https://azurestocking.github.io"

# Set to false (or remove) when ready to launch — adds a noindex meta tag site-wide.
noindex: true

# Your GoatCounter site code -- the subdomain you pick when registering at
# goatcounter.com (e.g. "azurestocking" for azurestocking.goatcounter.com).
# Leave "" to disable analytics.
goatcounter: "azurestocking"

markdown: kramdown
permalink: pretty

collections:
  projects:
    output: true
    permalink: /project/:title/

defaults:
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: "project"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - .DS_Store 