<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
    <title>GEMMA, Design Engineer</title>
    <meta name="description">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/helvetica-neue-lt-pro-55" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <style>:root { {% if page['theme-color'] and page['theme-color'] != '' %}--accent: {{ page['theme-color'] }}; --project-theme: {{ page['theme-color'] }};{% endif %} --project-bg: {{ page['bg-color'] | default: '#ffffff' }}; }</style>
    {% if site.page_loader %}
    <script>document.documentElement.classList.add('is-loading');
    window.PAGE_LOADER = { fraction: {{ site.page_loader_fraction | default: 0.34 }}, timeout: {{ site.page_loader_timeout | default: 6000 }} };</script>
    <noscript><style>#page-loader{display:none!important}html.is-loading,html.is-loading body{overflow:auto!important}</style></noscript>
    {% endif %}
    {% if site.goatcounter and site.goatcounter != "" %}
    <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    {% endif %}
</head>
<body>
    {% if site.page_loader %}
    <div id="page-loader" role="status" aria-label="Loading">
        <div class="page-loader-inner">
            <img class="page-loader-face" src="{{ '/images/my-notion-face.png' | relative_url }}" alt="">
            <div class="page-loader-bar"><span></span></div>
        </div>
    </div>
    {% endif %}
    <header>
        <div class="nav-blur" aria-hidden="true">
            <div></div><div></div><div></div><div></div><div></div>
        </div>
        <div class="grid">
            <div class="logo col-start-4 col-span-6">
                <a href="{{ '/' | relative_url }}">GEMMA</a>
            </div>
        </div>
    </header>

    <main>
        {{ content }}
    </main>
    
    <div class="grid" aria-label="feature">
        <hr class="col-start-4 col-span-6">
    </div>

    <footer id="footer">
        <div class="grid">
            <p class="eyebrow col-start-4 col-span-6">Built with 🤖 Jekyll and 🍵 Black Tea</p>
        </div>
    </footer>
    {% if site.page_loader %}<script src="{{ '/js/page-loader.js' | relative_url }}"></script>{% endif %}
</body>
</html>
