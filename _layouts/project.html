---
layout: default
---

<style>:root { {% if page['theme-color'] and page['theme-color'] != '' %}--accent: {{ page['theme-color'] }};{% endif %} --project-bg: {{ page['bg-color'] | default: '#ffffff' }}; }</style>

<section>
    <div class="grid">
        <div class="col-start-4 col-span-6">
            <div class="p-xl">{{ page.name }}</div>
        </div>
    
        <div class="col-start-4 col-span-6">
            <div class="p-l">{{ page.desc }}</div>
        </div>
    
        <div class="col-start-3 col-span-8">
            <div class="image-container hero-mockup" style="--media-color: {{ page['bg-color'] | default: 'var(--ghost)' }};">
                {% if page.image contains '.mp4' %}
                    {% include mockup-macbook.html content_image=page.image content_type="video" %}
                {% else %}
                    {% include mockup-macbook.html content_image=page.image content_type="image" %}
                {% endif %}
            </div>
        </div>
    </div>
</section>

<nav id="scrollspy" aria-label="Section navigation">
    <div class="grid">
        <div class="scrollspy-content col-start-4 col-span-6">
            <div class="scrollspy-links" id="scrollspy-links">
            </div>
        </div>
    </div>
</nav>

{{ content }}

<script src="{{ '/js/scrollspy.js' | relative_url }}"></script>
